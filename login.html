<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fazer login — Praça</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--blue:#0B57D0;--ink:#1F1F1F;--muted:#444746;--line:#747775;--err:#B3261E}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:16px;background:#F0F4F9;font:14px/1.43 Roboto,"Segoe UI",Arial,sans-serif;color:var(--ink)}
.card{width:100%;max-width:900px;display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:36px 40px;background:#fff;border-radius:28px}
h1{font:400 24px/1.33 Roboto,Arial,sans-serif;margin:20px 0 12px}
.sub{font-size:16px;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:4px;padding:4px 12px 4px 4px;border:1px solid #C4C7C5;border-radius:16px;background:#fff;font:500 14px Roboto,Arial,sans-serif;cursor:pointer}
.chip i{width:24px;height:24px;border-radius:50%;background:#0E7C66}
.field{position:relative;margin-top:24px}
.field input{width:100%;height:56px;padding:16px;font:16px Roboto,Arial,sans-serif;border:1px solid var(--line);border-radius:4px;outline:0;background:transparent}
.field label{position:absolute;left:12px;top:16px;padding:0 4px;background:#fff;color:var(--muted);font-size:16px;pointer-events:none;transition:all .15s}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:-9px;font-size:12px}
.field input:focus{border:2px solid var(--blue);padding:15px}
.field input:focus+label{color:var(--blue)}
.field.err input,.field.err input:focus{border-color:var(--err)}
.field.err label{color:var(--err)}
.msg{min-height:18px;margin:6px 16px 0;color:var(--err);font-size:12px}
.info{margin-top:24px;color:var(--muted)}
.check{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:40px}
.link{background:none;border:0;padding:8px;margin-left:-8px;border-radius:4px;color:var(--blue);font:500 14px Roboto,Arial,sans-serif;cursor:pointer}
.link:hover{background:#EDF2FA}
.btn{height:40px;padding:0 24px;border:0;border-radius:20px;background:var(--blue);color:#fff;font:500 14px Roboto,Arial,sans-serif;cursor:pointer}
.btn:hover{background:#0A4DB9;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.btn:disabled{background:#C4C7C5;box-shadow:none;cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
footer{display:flex;gap:24px;font-size:12px;color:var(--muted)}
@media(max-width:700px){.card{grid-template-columns:1fr;max-width:450px;padding:32px 24px;gap:0}}
</style>
</head>
<body>
<main class="card">
  <div>
    <svg width="40" height="40" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#0E7C66"/><circle cx="14" cy="14" r="6" fill="#FFC93C"/></svg>
    <h1 id="title">Fazer login</h1>
    <p class="sub" id="sub">Use sua Conta Praça</p>
    <button type="button" class="chip" id="chip" hidden aria-label="Voltar e trocar de e-mail"><i></i><span id="chipText"></span></button>
  </div>

  <form id="f" novalidate>
    <!-- Etapa 1: e-mail -->
    <section id="s1">
      <div class="field">
        <input id="email" type="email" placeholder=" " autocomplete="username" autofocus>
        <label for="email">E-mail</label>
        <div class="msg" aria-live="polite"></div>
      </div>
      <p class="info">Esta é uma página de demonstração: nenhum dado é enviado a servidores.</p>
    </section>

    <!-- Etapa 2: senha -->
    <section id="s2" hidden>
      <div class="field">
        <input id="pass" type="password" placeholder=" " autocomplete="current-password">
        <label for="pass">Digite sua senha</label>
        <div class="msg" aria-live="polite"></div>
      </div>
      <label class="check"><input type="checkbox" id="show"> Mostrar senha</label>
    </section>

    <div class="actions">
      <button type="button" class="link" id="alt">Criar conta</button>
      <button class="btn" id="next">Próxima</button>
    </div>
  </form>
</main>

<footer><span>Português (Brasil)</span><span>Ajuda</span><span>Privacidade</span><span>Termos</span></footer>

<script>
const $ = id => document.getElementById(id);
let etapa = 1;

function erro(input, texto) {
  const campo = input.closest('.field');
  campo.classList.toggle('err', !!texto);
  campo.querySelector('.msg').textContent = texto || '';
  input.setAttribute('aria-invalid', !!texto);
  if (texto) input.focus();
}

function ir(n) {
  etapa = n;
  $('s1').hidden = n !== 1;
  $('s2').hidden = n !== 2;
  $('chip').hidden = n !== 2;
  $('sub').hidden = n === 2;
  $('title').textContent = n === 1 ? 'Fazer login' : 'Olá!';
  $('next').textContent = n === 1 ? 'Próxima' : 'Entrar';
  $('alt').textContent = n === 1 ? 'Criar conta' : 'Esqueceu a senha?';
  (n === 1 ? $('email') : $('pass')).focus();
}

$('email').addEventListener('input', () => erro($('email')));
$('pass').addEventListener('input', () => erro($('pass')));
$('show').addEventListener('change', e => $('pass').type = e.target.checked ? 'text' : 'password');
$('chip').addEventListener('click', () => ir(1));

$('f').addEventListener('submit', e => {
  e.preventDefault();

  if (etapa === 1) {
    const v = $('email').value.trim();
    if (!v) return erro($('email'), 'Digite um e-mail');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return erro($('email'), 'Insira um e-mail válido');
    $('chipText').textContent = v;
    return ir(2);
  }

  if ($('pass').value.length < 8) return erro($('pass'), 'Use pelo menos 8 caracteres');

  // DEMONSTRAÇÃO: em um sistema real, e-mail e senha seriam enviados por HTTPS
  // a um servidor, que compara o HASH da senha guardado no banco de dados.
  // Validar login apenas no navegador NÃO é seguro.
  $('next').disabled = true;
  $('next').textContent = 'Entrando…';
  try { sessionStorage.setItem('praca_user', $('email').value.trim()); } catch (_) {}
  setTimeout(() => location.href = 'index.html', 700);
});
</script>
</body>
</html>
